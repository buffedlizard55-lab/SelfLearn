name: Research loop

# The engine is a process, not a daemon: continuity comes from this schedule. Each
# run does one bounded cycle, publishes the site, and commits the updated library and
# pages back to the branch it ran on, so the published site is always the state of
# the store it was built from.
#
# Sources that need a key are simply skipped when the secret is absent; the run
# records a `credential_required` status rather than failing. Add the secrets below
# in Settings -> Secrets and variables -> Actions to enable them.
#
# Required (the engine will not call these without one):
#   EIA_API_KEY, FRED_API_KEY, NCEI_TOKEN, USPTO_ODP_API_KEY
# Optional (raise the operator's rate limit):
#   NASA_API_KEY, NVD_API_KEY, NCBI_API_KEY, S2_API_KEY, STACKEXCHANGE_KEY,
#   DOAJ_API_KEY, CENSUS_API_KEY
#
# The names are the ones the register reads; `python3 -m selflearn credentials`
# prints the same list and says which of them an adapter actually transmits.
# USPTO_ODP_API_KEY replaced PATENTSVIEW_API_KEY when the register moved to the
# Open Data Portal: USPTO states that previously issued PatentsView keys are not
# valid for ODP APIs.

on:
  schedule:
    # Every six hours. GitHub may delay scheduled runs under load; the engine is
    # idempotent, so a delayed or repeated run produces the same records.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Evidence mode for this cycle
        type: choice
        options: [live, snapshot, fixture]
        default: live

permissions:
  contents: write

concurrency:
  group: research-loop
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SELFLEARN_MODE: ${{ github.event.inputs.mode || 'live' }}
      # Required credentials. Each is empty unless the secret exists, and the
      # engine records `credential_required` for the source rather than failing.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NCEI_TOKEN: ${{ secrets.NCEI_TOKEN }}
      USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
      # Optional credentials: the source is reachable without them, but the
      # operator's documented rate limit is higher with one.
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      DOAJ_API_KEY: ${{ secrets.DOAJ_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      # GitHub's built-in token, which the runner already has: the adapter sends
      # it as `Authorization: Bearer` and the primary rate limit rises from 60
      # requests/hour to the GITHUB_TOKEN limit of 1,000/hour per repository.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Environment
        run: python3 --version

      - name: Test suite
        run: python3 -m unittest discover -s tests -t . -p "test_*.py"

      - name: Source reachability
        # Recorded in the log and on the sources page. A source that cannot be
        # reached is a finding, not a failure.
        run: python3 -m selflearn sources --probe

      - name: Credential status
        # Which keyed sources are enabled by the secrets above, and where a free
        # key is issued for the ones that are not. Never fails the run.
        run: python3 -m selflearn credentials

      - name: Link check
        # Every URL in the register, the change-scan mechanisms and the prose is
        # resolved and its status recorded in reports/link_check.json. Non-strict:
        # a moved page is a finding for a human, not a reason to stop a cycle.
        run: python3 tools/verify_links.py || true

      - name: Change scan
        # Polls only the sources whose operator documents a change filter, records
        # the window used, and turns unseen items into questions.
        run: python3 -m selflearn scan --query "autonomous research" --discover

      - name: Research cycle
        run: python3 -m selflearn run --mode "$SELFLEARN_MODE"

      - name: Audit the library
        run: python3 -m selflearn audit

      - name: Export the readable summary
        run: python3 tools/export_summary.py

      - name: Show the run summary
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("reports/run_summary.json").read_text())
          print("run:", data.get("run_id"), "mode:", data.get("mode"))
          for key, value in sorted((data.get("figures") or {}).items()):
              print(f"  {key}: {value}")
          result = data.get("irregularities") or {}
          print("irregularities:", (result.get("by_severity") or {}))
          PY

      - name: Commit the run
        run: |
          set -eu
          git config user.name "selflearn-bot"
          git config user.email "selflearn-bot@users.noreply.github.com"
          git add -A library evidence reports state docs
          if git diff --cached --quiet; then
            echo "No changes to commit: the cycle reproduced the stored state exactly."
            exit 0
          fi
          run_id=$(python3 -c "import json;print(json.load(open('state/last_cycle.json'))['run_id'])")
          git commit -m "research cycle ${run_id}"
          git push

      - name: Upload the artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            reports/
            state/
          if-no-files-found: warn
          retention-days: 30

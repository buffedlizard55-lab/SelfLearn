name: Tests

# Two jobs, because there are two things worth proving on every change:
#   1. the suite passes on a clean checkout with no network and no credentials;
#   2. a whole cycle runs end to end in fixture mode against a temporary root, so a
#      broken pipeline is caught without writing into the repository's own library.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no dependencies by design)
        run: python3 -m pip install --upgrade pip
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -p "test_*.py"

  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: End-to-end cycle into a temporary root
        # SELFLEARN_ROOT keeps the smoke run out of the repository's own library, so
        # this can run a real cycle on a runner with real egress.
        env:
          SELFLEARN_ROOT: ${{ runner.temp }}/selflearn-root
        run: |
          set -eu
          mkdir -p "$SELFLEARN_ROOT/docs"
          cp -r data "$SELFLEARN_ROOT/data"
          cp docs/*.md "$SELFLEARN_ROOT/docs/" 2>/dev/null || true
          python3 -m selflearn run --mode live --from-database
          python3 -m selflearn status
          test -f "$SELFLEARN_ROOT/docs/index.html"
          test -f "$SELFLEARN_ROOT/docs/documents.html"
          test -f "$SELFLEARN_ROOT/reports/irregularities.md"
          python3 tools/export_summary.py --out "$SELFLEARN_ROOT/reports/SUMMARY.md"
      - name: Calibration sweep
        env:
          SELFLEARN_ROOT: ${{ runner.temp }}/selflearn-root
        run: python3 -m selflearn calibrate

  links:
    runs-on: ubuntu-latest
    permissions:
      # This job commits the link register back to the branch: the report is the
      # evidence behind the site's official-link tables, and this runner is the
      # one environment where every host is actually reachable.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve every published URL
        # The runners have unrestricted egress, so this is the environment where a
        # moved documentation page is actually detectable. Reported, not enforced:
        # a source operator moving a page should not turn the build red.
        run: |
          python3 tools/verify_links.py \
            --label "GitHub Actions ubuntu-latest (unrestricted egress)" \
            | tee reports/link_check.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### Link check'
            echo '```'
            head -3 reports/link_check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the link register
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check
          path: |
            reports/link_check.json
            reports/link_check.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Commit the register when an outcome changed
        # Guarded twice: only on a push (a pull-request checkout cannot push), and
        # only when a URL's outcome actually moved, so timings and timestamps do
        # not turn every run into a commit. [skip ci] keeps it from re-triggering.
        if: github.event_name == 'push'
        run: |
          set -eu
          git config user.name "selflearn-bot"
          git config user.email "selflearn-bot@users.noreply.github.com"
          if ! python3 tools/link_check_changed.py; then
            echo "No published URL changed outcome; leaving the committed report alone."
            exit 0
          fi
          git add reports/link_check.json
          # The site embeds the register's figures (the landing page's "N of M
          # published URLs resolved"), so republish in the same commit. Without
          # this the pages kept quoting the previous check until the next
          # scheduled cycle - a stale figure on the front door, found by review
          # on 2026-09-22.
          python3 -m selflearn site
          git add docs index.html 404.html .nojekyll
          if git diff --cached --quiet; then
            echo "Nothing staged after all."
            exit 0
          fi
          git commit -m "Link register: outcomes re-checked from a runner with unrestricted egress [skip ci]"
          git push
